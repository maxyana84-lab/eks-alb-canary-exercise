apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-v1
  namespace: payments
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments
      version: v1
  template:
    metadata:
      labels:
        app: payments
        version: v1
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo
          args: ["-text=payments-v1-stable", "-listen=:8080"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payments-v1
  namespace: payments
spec:
  type: ClusterIP
  selector:
    app: payments
    version: v1
  ports:
    - port: 80
      targetPort: 8080
